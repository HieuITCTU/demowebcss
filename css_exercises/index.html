<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles.css"><!--external styles-->
    <style>
        .h1{
            color: lightblue;
        }
    </style><!--internal styles-->
</head>
<body>
    <h1>Chào mừng bạn đến với CSS!</h1>
    <p>Đây là đoạn văn bản đầu tiên</p>
    <p>Đây là đoạn văn bản thứ hai</p>
    <div> Đây là phần khối nội dung</div>
    <p style="color: green;">
        Đoạn này sẽ được style inline.

    </p>

</body>
</html>
